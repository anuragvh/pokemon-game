<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Route 01</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<style>
/* Layout: one handheld-style screen centred on a dark console backdrop, controls legend underneath. */
:root {
  --backdrop: #1b1f2e;
  --bezel: #2b3146;
  --hint: #98a2bd;
  --hint-key: #e9ecf5;
  --box: #f8f8f8;
  --box-edge: #4a6680;
  --box-inner: #a9c9db;
  --ink: #404850;
  --ink-soft: #8890a0;
  --ink-shadow: #d4d4cc;
  --cursor: #e04030;
  --s: 4px;                       /* screen pixel size, set by JS */
  --pixel: "Press Start 2P", ui-monospace, "Courier New", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--backdrop);
  color: var(--hint);
  font-family: var(--pixel);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 20px;
  padding-inline: 16px;
  overflow: hidden;
  user-select: none; -webkit-user-select: none;
}

#screen {
  position: relative;
  width: calc(var(--s) * 288);
  height: calc(var(--s) * 192);
  outline: calc(var(--s) * 3) solid var(--bezel);
  border-radius: 2px;
  overflow: hidden;
  background: #000;
}
#game { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }

/* GBA-style boxes */
.box {
  position: absolute;
  background: var(--box);
  border: calc(var(--s) * 2) solid var(--box-edge);
  border-radius: calc(var(--s) * 4);
  box-shadow: inset 0 0 0 var(--s) var(--box-inner), 0 0 0 var(--s) #1f2a36;
  color: var(--ink);
  font-size: calc(var(--s) * 7);
  line-height: calc(var(--s) * 14);
  text-shadow: var(--s) var(--s) 0 var(--ink-shadow);
  z-index: 3;
}
.dialog {
  left: calc(var(--s) * 6); right: calc(var(--s) * 6); bottom: calc(var(--s) * 5);
  height: calc(var(--s) * 44);
  padding: calc(var(--s) * 7) calc(var(--s) * 10) 0;
  cursor: pointer;
}
.dialog p { margin: 0; white-space: pre-wrap; }
#rest { visibility: hidden; }
#more {
  position: absolute; right: calc(var(--s) * 8); bottom: calc(var(--s) * 5);
  width: 0; height: 0;
  border-left: calc(var(--s) * 3.5) solid transparent;
  border-right: calc(var(--s) * 3.5) solid transparent;
  border-top: calc(var(--s) * 4) solid var(--cursor);
  animation: bob .6s steps(2) infinite;
}
@keyframes bob { 50% { transform: translateY(var(--s)); } }

.choice {
  right: calc(var(--s) * 6); bottom: calc(var(--s) * 52);
  padding: calc(var(--s) * 5) calc(var(--s) * 10) calc(var(--s) * 5) calc(var(--s) * 16);
  min-width: calc(var(--s) * 60);
}
.opt { position: relative; cursor: pointer; white-space: nowrap; }
.opt.sel::before {
  content: ""; position: absolute;
  left: calc(var(--s) * -9); top: calc(var(--s) * 3.5);
  border-top: calc(var(--s) * 3.5) solid transparent;
  border-bottom: calc(var(--s) * 3.5) solid transparent;
  border-left: calc(var(--s) * 4) solid var(--ink);
}

/* Free-text answer box */
.entry {
  left: calc(var(--s) * 6); right: calc(var(--s) * 6); bottom: calc(var(--s) * 52);
  padding: calc(var(--s) * 5) calc(var(--s) * 10) calc(var(--s) * 4);
  display: flex; flex-direction: column; gap: calc(var(--s) * 2);
}
.entry input {
  font: inherit; color: var(--ink); text-shadow: inherit;
  background: transparent; border: 0;
  border-bottom: var(--s) solid var(--box-inner);
  padding: 0 0 var(--s); outline: none; width: 100%;
  caret-color: var(--cursor);
  user-select: text; -webkit-user-select: text;
}
.entry input::placeholder { color: var(--ink-soft); text-shadow: none; }
.entry small { font-size: calc(var(--s) * 5); line-height: calc(var(--s) * 8); color: var(--ink-soft); text-shadow: none; }

/* Location banner that drops in from the top-left */
.loc {
  left: calc(var(--s) * 6); top: calc(var(--s) * 6);
  padding: calc(var(--s) * 4) calc(var(--s) * 10);
  font-size: calc(var(--s) * 7); line-height: calc(var(--s) * 10);
  transform: translateY(calc(var(--s) * -40));
  transition: transform .35s steps(6);
}
.loc.show { transform: none; }

/* Trait gems, top-right, shown indoors */
.badges {
  right: calc(var(--s) * 4); top: calc(var(--s) * 4);
  display: flex; align-items: center; gap: calc(var(--s) * 5);
  padding: calc(var(--s) * 2) calc(var(--s) * 6);
  border-width: var(--s);
  font-size: calc(var(--s) * 4); line-height: calc(var(--s) * 8);
}
.badges i {
  width: calc(var(--s) * 4); height: calc(var(--s) * 4);
  transform: rotate(45deg);
  border: var(--s) solid var(--ink-soft);
  background: transparent;
}
.badges i.on { background: var(--gem); border-color: var(--ink); }
.badges i.pop { animation: pop .5s steps(4) 2; }
@keyframes pop { 50% { transform: rotate(45deg) scale(1.6); } }

#fade { position: absolute; inset: 0; background: #000; opacity: 0; transition: opacity .35s linear; z-index: 2; pointer-events: none; }
#fade.on { opacity: 1; }
#fade.cold { background: #0a1430; opacity: .45; transition: opacity .15s linear; }
#fade.patronus { background: #eef4ff; opacity: .9; transition: opacity .1s linear; }
#screen.quake { animation: quake .08s steps(2) 10; }
@keyframes quake { 50% { transform: translate(calc(var(--s) * 2), calc(var(--s) * -1)); } }
@media (prefers-reduced-motion: reduce) { #screen.quake { animation: none; } }

.legend {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 28px;
  font-size: 10px; line-height: 1.6; letter-spacing: .04em; text-align: center;
}
.legend b { color: var(--hint-key); font-weight: 400; }

/* Touch controls, only on coarse pointers */
.pad { display: none; width: 100%; max-width: 420px; justify-content: space-between; align-items: center; }
@media (pointer: coarse) { .pad { display: flex; } .legend { display: none; } }
.dpad { display: grid; grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(3, 48px); }
.dpad button, .ab button {
  font: inherit; font-size: 12px; color: var(--hint-key);
  background: var(--bezel); border: 0; touch-action: none;
}
.dpad button:active, .ab button:active { background: #3c4562; }
.dpad [data-k="up"] { grid-area: 1 / 2; border-radius: 6px 6px 0 0; }
.dpad [data-k="left"] { grid-area: 2 / 1; border-radius: 6px 0 0 6px; }
.dpad [data-k="right"] { grid-area: 2 / 3; border-radius: 0 6px 6px 0; }
.dpad [data-k="down"] { grid-area: 3 / 2; border-radius: 0 0 6px 6px; }
.dpad .hub { grid-area: 2 / 2; background: var(--bezel); }
.ab { display: flex; gap: 14px; align-items: center; }
.ab button { width: 58px; height: 58px; border-radius: 50%; background: #8a2c3c; }
.ab [data-k="b"] { transform: translateY(18px); }
button:focus-visible { outline: 2px solid var(--hint-key); }

@media (prefers-reduced-motion: reduce) {
  #more, .badges i.pop { animation: none; }
  .loc, #fade { transition: none; }
}

/* "Z  action" hint chip near interactive objects */
.hint {
  left: 50%; bottom: calc(var(--s) * 5);
  transform: translateX(-50%);
  padding: calc(var(--s) * 3) calc(var(--s) * 8);
  font-size: calc(var(--s) * 6); line-height: calc(var(--s) * 10);
  white-space: nowrap;
}
.hint b { color: var(--cursor); font-weight: 400; margin-right: calc(var(--s) * 4); }

/* Town-map style travel view */
#mapview { position: absolute; inset: 0; z-index: 4; background: #000; }
#mapview canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
.maptitle {
  left: calc(var(--s) * 6); top: calc(var(--s) * 6);
  padding: calc(var(--s) * 4) calc(var(--s) * 10);
  font-size: calc(var(--s) * 7); line-height: calc(var(--s) * 10);
}
.mapinfo {
  left: calc(var(--s) * 6); right: calc(var(--s) * 6); bottom: calc(var(--s) * 5);
  padding: calc(var(--s) * 5) calc(var(--s) * 10);
  display: grid; grid-template-columns: 1fr auto; column-gap: calc(var(--s) * 8); align-items: end;
}
.mapinfo b { font-weight: 400; font-size: calc(var(--s) * 7); line-height: calc(var(--s) * 11); }
.mapinfo span { grid-column: 1; font-size: calc(var(--s) * 5); line-height: calc(var(--s) * 9); color: var(--ink); }
.mapinfo small {
  grid-column: 2; grid-row: 1 / span 2; text-align: right;
  font-size: calc(var(--s) * 5); line-height: calc(var(--s) * 9); color: var(--ink-soft); text-shadow: none;
}
/* World map: the map shifts left and a story panel fills the right */
.mapstory {
  right: calc(var(--s) * 6); top: calc(var(--s) * 6); bottom: calc(var(--s) * 5); width: calc(var(--s) * 94);
  padding: calc(var(--s) * 6) calc(var(--s) * 7);
  font-size: calc(var(--s) * 5); line-height: calc(var(--s) * 9);
  overflow-y: auto;
}
.mapstory small { display: block; color: var(--ink-soft); text-shadow: none; margin-bottom: calc(var(--s) * 3); }
.mapstory p { margin: 0; white-space: pre-line; }
#mapview.story .mapinfo { right: calc(var(--s) * 106); }
#mapCursor {
  position: absolute; z-index: 1; width: 0; height: 0;
  border-left: calc(var(--s) * 4) solid transparent;
  border-right: calc(var(--s) * 4) solid transparent;
  border-top: calc(var(--s) * 5) solid #f8f048;
  filter: drop-shadow(0 calc(var(--s) * -1) 0 #303038) drop-shadow(0 var(--s) 0 #303038);
  transform: translate(-50%, calc(var(--s) * -9));
  animation: bob .5s steps(2) infinite;
}
@media (prefers-reduced-motion: reduce) { #mapCursor { animation: none; } }

/* Record crate: playlist browser */
#crate { position: absolute; inset: 0; z-index: 4; background: #2a1e18; }
#crate::before {               /* felt-lined crate: subtle stripes */
  content: ""; position: absolute; inset: 0;
  background: repeating-linear-gradient(90deg, transparent 0 calc(var(--s) * 15), rgba(0,0,0,.18) calc(var(--s) * 15) calc(var(--s) * 16));
}
.sleeve {
  position: absolute; left: calc(var(--s) * 12); top: calc(var(--s) * 32);
  width: calc(var(--s) * 96); height: calc(var(--s) * 80);
  image-rendering: pixelated; image-rendering: crisp-edges;
}
.video {
  position: absolute; left: calc(var(--s) * 10); top: calc(var(--s) * 32);
  width: calc(var(--s) * 164); height: calc(var(--s) * 92.25);
  border: calc(var(--s) * 3) solid #181418; border-radius: calc(var(--s) * 3);
  box-shadow: 0 0 0 var(--s) #6a4428; background: #000; overflow: hidden;
}
.video iframe { width: 100%; height: 100%; border: 0; display: block; }
#crate.watching .cratedesc { left: calc(var(--s) * 184); }   /* narrower, beside the video */
.cratedesc {
  left: calc(var(--s) * 116); right: calc(var(--s) * 6); top: calc(var(--s) * 32);
  padding: calc(var(--s) * 6) calc(var(--s) * 9);
  font-size: calc(var(--s) * 5); line-height: calc(var(--s) * 9);
}
.cratedesc b { display: block; font-weight: 400; font-size: calc(var(--s) * 7); line-height: calc(var(--s) * 11); margin-bottom: calc(var(--s) * 3); }
.cratedesc p { margin: 0; white-space: pre-wrap; }
.cratedesc a {
  display: inline-block; margin-top: calc(var(--s) * 5);
  color: #1a8a48; text-decoration: none; text-shadow: none;
}
.cratedesc a:hover, .cratedesc a:focus-visible { text-decoration: underline; }
.player {
  position: absolute; left: calc(var(--s) * 6); right: calc(var(--s) * 6);
  bottom: calc(var(--s) * 30);
  height: 80px;                 /* Spotify's compact player */
  border-radius: 12px;
  overflow: hidden; background: #181818;
}
.player iframe { width: 100%; height: 100%; border: 0; display: block; }
.player .soon {
  height: 100%; display: flex; align-items: center; justify-content: center; text-align: center;
  color: #b8b0a0; font-size: calc(var(--s) * 5); line-height: calc(var(--s) * 9); padding-inline: calc(var(--s) * 8);
}
.linkbtn { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.linkbtn:hover { color: var(--ink); }
.cratebar {
  left: calc(var(--s) * 6); right: calc(var(--s) * 6); bottom: calc(var(--s) * 5);
  padding: calc(var(--s) * 3) calc(var(--s) * 9);
  display: flex; justify-content: space-between; gap: calc(var(--s) * 8);
  font-size: calc(var(--s) * 5); line-height: calc(var(--s) * 9); color: var(--ink-soft); text-shadow: none;
}

/* Patronus prompt: mash Z to fill the meter */
.spell {
  left: 50%; bottom: calc(var(--s) * 6);
  transform: translateX(-50%);
  width: calc(var(--s) * 200);
  padding: calc(var(--s) * 6) calc(var(--s) * 10);
  display: flex; flex-direction: column; align-items: center; gap: calc(var(--s) * 4);
  text-align: center;
}
.spell b { font-weight: 400; font-size: calc(var(--s) * 8); line-height: calc(var(--s) * 12); color: #3a4a8a; }
.spell .meter {
  width: 100%; height: calc(var(--s) * 8);
  border: var(--s) solid var(--ink); border-radius: calc(var(--s) * 2);
  background: #283048; overflow: hidden;
}
.spell .meter i {
  display: block; height: 100%; width: 0%;
  background: linear-gradient(#ffffff, #c8d8ff 60%, #9ab0f0);
}
.spell small { font-size: calc(var(--s) * 5); line-height: calc(var(--s) * 8); color: var(--ink-soft); text-shadow: none; animation: blink .5s steps(2) infinite; }
.spell small em { font-style: normal; color: var(--cursor); }
@keyframes blink { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .spell small { animation: none; } }

/* Personality board card */
.card {
  left: 50%; top: 50%;
  transform: translate(-50%, -54%);
  width: calc(var(--s) * 220);
  padding: calc(var(--s) * 8) calc(var(--s) * 11) calc(var(--s) * 7);
  z-index: 4;
  display: flex; flex-direction: column; gap: calc(var(--s) * 4);
}
.cardhead { display: flex; align-items: center; gap: calc(var(--s) * 5); }
.cardhead canvas { width: calc(var(--s) * 9); height: calc(var(--s) * 9); image-rendering: pixelated; }
.chip {
  background: var(--chip); color: #fff; text-shadow: none;
  font-size: calc(var(--s) * 5); line-height: calc(var(--s) * 9);
  padding: 0 calc(var(--s) * 4); border-radius: calc(var(--s) * 2);
}
.cardhead small { margin-left: auto; font-size: calc(var(--s) * 5); color: var(--ink-soft); text-shadow: none; }
.card b { font-weight: 400; font-size: calc(var(--s) * 8); line-height: calc(var(--s) * 12); }
.card p { margin: 0; font-size: calc(var(--s) * 6); line-height: calc(var(--s) * 10); white-space: pre-line; }
.card .ok { align-self: flex-end; font-size: calc(var(--s) * 5); line-height: calc(var(--s) * 8); color: var(--ink-soft); text-shadow: none; }
.card .ok b { font-size: inherit; line-height: inherit; color: var(--cursor); }

/* Attic collections: trophies, goals, bucket list, tapes */
#shelf { position: absolute; inset: 0; z-index: 4; background: #3a2416; }
#shelf.badges {                   /* red leather badge case with gold stitching */
  background: radial-gradient(ellipse at 50% 30%, #9a2836, #6a1622);
  box-shadow: inset 0 0 0 calc(var(--s) * 5) #4a0e16, inset 0 0 0 calc(var(--s) * 6) #c8a050;
}
#shelf.badges .shelfrow { gap: calc(var(--s) * 16); top: calc(var(--s) * 50); }
#shelf.badges .shelfrow canvas {
  width: calc(var(--s) * 46); height: calc(var(--s) * 46);
  padding: calc(var(--s) * 6); border-radius: 50%;
  background: radial-gradient(circle, #3a0a12 62%, #2a060c 64%, #5a1a24 70%);
}
#shelf.trophy {
  background: repeating-linear-gradient(90deg, rgba(0,0,0,.14) 0 var(--s), transparent var(--s) calc(var(--s) * 12)), #4a2e1c;
}
#shelf.trophy .shelfrow { border-bottom: calc(var(--s) * 4) solid #8a5a38; box-shadow: 0 calc(var(--s) * 3) 0 #241408; }
#shelf.night {
  background: radial-gradient(circle, #e8e8ff var(--s), transparent calc(var(--s) * 1.3)) 0 0 / calc(var(--s) * 37) calc(var(--s) * 29),
              radial-gradient(circle, #9aa4d8 calc(var(--s) * .8), transparent var(--s)) calc(var(--s) * 13) calc(var(--s) * 9) / calc(var(--s) * 23) calc(var(--s) * 31),
              radial-gradient(circle, #c8d0ff calc(var(--s) * .8), transparent var(--s)) calc(var(--s) * 5) calc(var(--s) * 20) / calc(var(--s) * 41) calc(var(--s) * 19),
              linear-gradient(#0a0f26, #1c2650);
}
/* the future: three rows of stars (do, dream, achieve) that twinkle */
#shelf.night .shelfrow {
  display: grid; grid-template-columns: repeat(3, auto); justify-content: center;
  column-gap: calc(var(--s) * 26); row-gap: calc(var(--s) * 3); top: calc(var(--s) * 32);
}
#shelf.night .shelfrow canvas { width: calc(var(--s) * 24); height: calc(var(--s) * 24); animation: twinkle 2.4s ease-in-out infinite; }
#shelf.night .shelfrow canvas:nth-child(3n+2) { animation-delay: -.8s; }
#shelf.night .shelfrow canvas:nth-child(3n) { animation-delay: -1.6s; }
#shelf.night .shelfrow canvas.sel { animation: none; }
@keyframes twinkle { 50% { opacity: .55; } }
@media (prefers-reduced-motion: reduce) { #shelf.night .shelfrow canvas { animation: none; } }
#shelf.vhs {
  background: repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 var(--s), transparent var(--s) calc(var(--s) * 3)), #1c1c26;
}
.shelfscreen {
  position: absolute; left: 50%; top: calc(var(--s) * 28);
  transform: translateX(-50%);
  width: calc(var(--s) * 124); height: calc(var(--s) * 56);
  border: calc(var(--s) * 4) solid #c8c0b0; border-radius: calc(var(--s) * 8);
  box-shadow: 0 0 0 var(--s) #303038, 0 calc(var(--s) * 3) 0 rgba(0,0,0,.35);
  background: var(--screen, #111);
  display: flex; align-items: center; justify-content: center;
  padding: calc(var(--s) * 6); overflow: hidden;
}
.shelfscreen::after {             /* scanlines + a soft glass vignette */
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.12) 0 var(--s), transparent var(--s) calc(var(--s) * 2)),
              radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.35));
}
.shelfscreen img { max-width: 100%; max-height: 100%; object-fit: contain; }
.shelfscreen.has-still { padding: 0; }
.shelfscreen.has-still::after { display: none; }      /* real images stay clean: no scanlines or vignette */
.shelfscreen.has-still img {          /* pinned to the screen so a big photo can't stretch the TV */
  position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; max-height: none; object-fit: cover;
}
#shelf.has-screen .shelfrow { top: calc(var(--s) * 89); }
.shelfrow {
  position: absolute; left: calc(var(--s) * 12); right: calc(var(--s) * 12); top: calc(var(--s) * 40);
  display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end;
  gap: calc(var(--s) * 8); padding-bottom: calc(var(--s) * 3);
}
.shelfrow canvas {
  width: calc(var(--s) * 28); height: calc(var(--s) * 28);
  image-rendering: pixelated; image-rendering: crisp-edges; cursor: pointer;
}
.shelfrow canvas.sel {
  transform: translateY(calc(var(--s) * -5));
  filter: drop-shadow(var(--s) 0 0 #f8f048) drop-shadow(calc(var(--s) * -1) 0 0 #f8f048)
          drop-shadow(0 var(--s) 0 #f8f048) drop-shadow(0 calc(var(--s) * -1) 0 #f8f048);
}
#album.sepia { background: #e6d6b4; }
#album.sepia::before { background-image: radial-gradient(#cdb48a var(--s), transparent calc(var(--s) * 1.2)); }
#album.sepia .tape { background: rgba(200, 180, 140, .75); }

/* Pet history photo album */
#album { position: absolute; inset: 0; z-index: 4; background: #f0e4c8; }
#album.cookbook { background: #f4efe2; }
#album.cookbook::before {      /* kitchen tiles instead of the scrapbook dots */
  background-image:
    linear-gradient(45deg, #e6dcc8 25%, transparent 25%, transparent 75%, #e6dcc8 75%),
    linear-gradient(45deg, #e6dcc8 25%, transparent 25%, transparent 75%, #e6dcc8 75%);
  background-size: calc(var(--s) * 16) calc(var(--s) * 16);
  background-position: 0 0, calc(var(--s) * 8) calc(var(--s) * 8);
}
#album.cookbook .tape { background: rgba(232, 88, 72, .55); }
#album::before {               /* scrapbook page: faint dotted grid */
  content: ""; position: absolute; inset: 0;

.photo {

.photo.portrait { top: calc(var(--s) * 10); width: calc(var(--s) * 70); height: calc(var(--s) * 116); }   /* 9:16 inside */

#album.pair .photo { left: calc(50% - var(--s) * 40); top: calc(var(--s) * 32); width: calc(var(--s) * 54); height: calc(var(--s) * 96); }

.photo .empty {

let seed = 20261012;
const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);

function canvas(w, h, draw) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const g = c.getContext("2d");
  draw && draw(g);
  return c;
}
function px(g, x, y, col) { g.fillStyle = col; g.fillRect(x, y, 1, 1); }
function R(g, x, y, w, h, col) { g.fillStyle = col; g.fillRect(x, y, w, h); }
function box(g, x, y, w, h, fill, line = C.ink) { R(g, x, y, w, h, line); R(g, x + 1, y + 1, w - 2, h - 2, fill); }
function disc(g, cx, cy, r, col) {
  for (let y = -Math.ceil(r); y <= r; y++)
    for (let x = -Math.ceil(r); x <= r; x++)
      if (x * x + y * y <= r * r) px(g, Math.round(cx + x), Math.round(cy + y), col);
}
function blob(g, cx, cy, rx, ry, fill, line = C.ink) {
  const inE = (x, y) => ((x + 0.5 - cx) / rx) ** 2 + ((y + 0.5 - cy) / ry) ** 2 <= 1;
  for (let y = Math.floor(cy - ry); y <= cy + ry; y++)
    for (let x = Math.floor(cx - rx); x <= cx + rx; x++) {
      if (!inE(x, y)) continue;
      const edge = !inE(x - 1, y) || !inE(x + 1, y) || !inE(x, y - 1) || !inE(x, y + 1);
      px(g, x, y, edge ? line : fill);
    }
}

const GLYPH = {
  O: ["111", "101", "101", "101", "111"],

function word(g, x, y, s, col) {

    [...row].forEach((b, k) => b === "1" && px(g, x + i * 4 + k, y + j, col))));

// Mountain range across the top 3 rows (48px): sky, a far snowy range, green foothills, then a grassy slope.
function drawMountains(g) {
  const W = TW * T, H = 48;
  for (let y = 0; y < H; y++) R(g, 0, y, W, 1, y < 16 ? "#a8d8f0" : "#b8e0f4");
  for (const [cx, cy] of [[70, 6], [300, 9], [420, 4]]) {          // a few pixel clouds
    R(g, cx, cy, 14, 3, "#f4fbff"); R(g, cx + 3, cy - 2, 7, 2, "#f4fbff"); R(g, cx + 2, cy + 3, 12, 1, "#d8eef8");
  }
  // ridge = lowest point of a set of triangular peaks; left faces catch the light
  const ridge = (peaks, x) => {
    let best = Infinity, who = null;
    for (const p of peaks) { const y = p[1] + Math.abs(x - p[0]) * p[2]; if (y < best) { best = y; who = p; } }
    return [Math.round(best), who];
  };
  const far = [[18, 6, 0.75], [74, 2, 0.8], [128, 9, 0.7], [182, 3, 0.85], [236, 7, 0.7], [292, 1, 0.8], [346, 8, 0.75], [398, 4, 0.8], [452, 6, 0.7]];
  const near = [[0, 22, 0.5], [52, 18, 0.45], [110, 24, 0.5], [168, 17, 0.45], [226, 23, 0.5], [282, 19, 0.45], [340, 24, 0.5], [394, 18, 0.45], [450, 22, 0.5]];
  for (let x = 0; x < W; x++) {
    const [top, p] = ridge(far, x);
    for (let y = Math.max(top, 0); y < H; y++) {
      const lit = x <= p[0];
      const snowLine = p[1] + 9 + ((x * 7 + p[0]) % 5 < 2 ? 2 : 0);
      let col = y < snowLine ? (lit ? "#ffffff" : "#d8e0f0") : (lit ? "#98a8d0" : "#7888b8");
      if (y === top) col = "#4a5888";
      px(g, x, y, col);
    }
    const [ntop, np] = ridge(near, x);
    for (let y = Math.max(ntop, 0); y < H; y++) {
      const lit = x <= np[0];
      let col = lit ? "#6aa880" : "#548c6c";
      if ((x + y * 3) % 11 === 0) col = lit ? "#7cbc90" : "#467a5c";            // little bits of scrub
      if (y === ntop) col = "#2f5a3a";
      px(g, x, y, col);
    }
  }
  // grassy slope meeting the meadow, with a soft shadow line
  for (let x = 0; x < W; x++) {
    const y0 = 40 + Math.round(Math.sin(x / 13) * 1.5 + Math.sin(x / 5) * 0.8);
    px(g, x, y0, "#3c7a58");
    R(g, x, y0 + 1, 1, H - y0 - 1, C.grass);
    if (x % 8 === 3) px(g, x, y0 + 3, C.grassDk);
  }
}

// The house: a cottage with a shingled roof, brick chimney (smoke puffs alternate by frame), a front door and shutters.
function drawBuilding(g, ox, oy, frame = 0) {
  // walls: cream siding
  R(g, ox + 3, oy + 34, 90, 46, C.ink);
  R(g, ox + 4, oy + 34, 88, 45, C.wall);
  for (let y = oy + 40; y < oy + 72; y += 5) R(g, ox + 4, y, 88, 1, C.wallDk);
  R(g, ox + 4, oy + 72, 88, 7, "#a89880");                                 // stone footing
  for (let x = ox + 6; x < ox + 92; x += 8) R(g, x, oy + 73, 1, 6, "#887860");
  R(g, ox + 4, oy + 75, 88, 1, "#887860");
  R(g, ox + 4, oy + 36, 88, 3, C.wallShadow);                              // shadow under the eaves

  // roof: a trapezoid, wider at the eaves, with rows of shingles
  const roofTop = oy - 2, roofBot = oy + 36;
  for (let y = roofTop; y < roofBot; y++) {
    const t = (y - roofTop) / (roofBot - roofTop);
    const x0 = Math.round(ox + 12 - t * 15), x1 = Math.round(ox + 84 + t * 15);
    R(g, x0, y, x1 - x0, 1, C.ink);
    const band = (y - roofTop - 2) % 6;
    const col = y < roofTop + 4 ? C.roofLt : y > roofBot - 5 ? C.roofDk : band === 0 ? C.roofLine : C.roof;
    R(g, x0 + 1, y, x1 - x0 - 2, 1, col);
    if (band > 0 && y >= roofTop + 4 && y <= roofBot - 5) {
      const row = Math.floor((y - roofTop - 2) / 6);
      for (let x = x0 + 3 + (row % 2) * 4; x < x1 - 2; x += 8) px(g, x, y, C.roofDk);
    }
  }
  R(g, ox + 12, roofTop, 72, 1, C.ink);

  // chimney: brick stack on the right of the roof, with a cap
  const cx = ox + 66, cy = oy - 12;
  R(g, cx, cy, 14, 22, C.ink);
  R(g, cx + 1, cy + 1, 12, 21, "#b85840");
  for (let y = cy + 4; y < cy + 22; y += 4) {
    R(g, cx + 1, y, 12, 1, "#8a3a28");
    for (let x = cx + 1 + ((y >> 2) % 2) * 3; x < cx + 13; x += 6) R(g, x, y + 1, 1, 3, "#8a3a28");
  }
  R(g, cx + 1, cy + 1, 2, 21, "#d07858");
  R(g, cx - 2, cy - 3, 18, 4, C.ink); R(g, cx - 1, cy - 2, 16, 2, "#5a5a60");
  // smoke: puffs drift up and to the right; the two frames alternate
  const puff = (x, y, r) => { disc(g, x, y, r, "#e8ecf0"); disc(g, x - r / 3, y - r / 3, r * 0.55, "#ffffff"); };
  const o = frame ? 2 : 0;
  puff(cx + 7 + o, cy - 7 - o, 3);
  puff(cx + 11 + o, cy - 14 - o, 3.6);
  puff(cx + 16 + o, cy - 22 - o, 2.6);

  // windows with shutters and flower boxes
  const win = (x, y) => {
    R(g, x - 5, y, 4, 15, C.ink); R(g, x - 4, y + 1, 2, 13, "#4f86a8");     // shutters

function drawWater(g, tx, ty, frame) {
  const o = {
    t: townAt(tx, ty - 1) !== "W", b: townAt(tx, ty + 1) !== "W",
    l: townAt(tx - 1, ty) !== "W", r: townAt(tx + 1, ty) !== "W",
  };
  const K = 4;
  const inside = (x, y) => {
    if (x < 0 && y < 0) return !o.l && !o.t;
    if (x > 15 && y < 0) return !o.r && !o.t;
    if (x < 0 && y > 15) return !o.l && !o.b;
    if (x > 15 && y > 15) return !o.r && !o.b;
    if (x < 0) return !o.l; if (x > 15) return !o.r;
    if (y < 0) return !o.t; if (y > 15) return !o.b;
    const corner = (cx, cy) => (x + 0.5 - cx) ** 2 + (y + 0.5 - cy) ** 2 > K * K;
    if (o.t && o.l && x < K && y < K && corner(K, K)) return false;
    if (o.t && o.r && x >= 16 - K && y < K && corner(16 - K, K)) return false;
    if (o.b && o.l && x < K && y >= 16 - K && corner(K, 16 - K)) return false;
    if (o.b && o.r && x >= 16 - K && y >= 16 - K && corner(16 - K, 16 - K)) return false;
    return true;
  };
  const ox = tx * T, oy = ty * T;
  for (let y = 0; y < T; y++) for (let x = 0; x < T; x++) {
    if (!inside(x, y)) continue;
    let col = C.water;
    if (!inside(x - 1, y) || !inside(x + 1, y) || !inside(x, y - 1) || !inside(x, y + 1)) col = C.pondEdge;
    else if (!inside(x, y - 2) || !inside(x, y - 3)) col = C.waterDk;
    else if ((y + tx * 3) % 7 === 3 && ((x + tx * 16 + frame * 3 + ty * 5) % 18) < 4) col = C.waterLt;
    px(g, ox + x, oy + y, col);
  }
}

function dogAnim(make, pal, offset, wagMs) {
  const f = pal
    ? { a: make(pal, {}), b: make(pal, { wag: true }), blink: make(pal, { blink: true }) }
    : { a: make({}), b: make({ wag: true }), blink: make({ blink: true }) };
  return {
    img: f.a,
    anim: t => {
      t += offset;
      if (t % 3400 < 160) return f.blink;
      return Math.floor(t / wagMs) % 2 ? f.b : f.a;
    },
  };
}

// ---- personality board tiles
const GLYPHS = {
  star:    ["...#...", "..###..", "#######", ".#####.", "..###..", ".##.##.", "##...##"],
  diamond: ["...#...", "..###..", ".#####.", "#######", ".#####.", "..###..", "...#..."],
  heart:   [".##.##.", "#######", "#######", ".#####.", "..###..", "...#...", "......."],
  ask:     [".###...", "#...#..", "...#...", "..#....", "..#....", ".......", "..#...."],
};
function shade(hex, k) {   // k > 0 lightens toward white, k < 0 darkens toward black
  const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
  const f = v => Math.round(k > 0 ? v + (255 - v) * k : v * (1 + k)).toString(16).padStart(2, "0");
  return "#" + f(r) + f(g) + f(b);
}
function glyph(g, name, x, y, col, outline) {
  const rows = GLYPHS[name];
  if (outline) rows.forEach((row, j) => [...row].forEach((c, i) => {
    if (c === "#") for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nr = rows[j + dy], nc = nr && nr[i + dx];
      if (nc !== "#") px(g, x + i + dx, y + j + dy, outline);
    }
  }));
  rows.forEach((row, j) => [...row].forEach((c, i) => c === "#" && px(g, x + i, y + j, col)));
}
// [row] -> { found, hidden: [2 pulse frames] }
const boardTiles = BOARD.map(row => {
  const tile = (fill, draw) => canvas(16, 16, g => {
    R(g, 0, 0, 16, 16, "#3e2818");                     // grout
    R(g, 1, 1, 14, 14, fill);
    R(g, 1, 1, 14, 1, shade(fill, 0.35)); R(g, 1, 1, 1, 14, shade(fill, 0.35));
    R(g, 1, 14, 14, 1, shade(fill, -0.3)); R(g, 14, 1, 1, 14, shade(fill, -0.3));
    draw(g);
  });
  const muted = shade(row.color, -0.35);
  return {
    found: tile(row.color, g => glyph(g, row.icon, 4, 4, "#ffffff", shade(row.color, -0.45))),
    hidden: [0.0, 0.18].map(k => tile(shade(muted, k), g => glyph(g, "ask", 5, 4, shade(row.color, 0.55)))),
  };
});
const boardAt = (x, y) => {
  const r = y - BOARD_Y, c = x - BOARD_X;
  return (r >= 0 && r < BOARD.length && c >= 0 && c < 6) ? { r, c } : null;
};
const boardKey = (r, c) => `${r},${c}`;
function drawBoard(cx, cy) {
  BOARD.forEach((row, r) => row.tiles.forEach((_, c) => {
    const set = boardTiles[r];
    const pulse = Math.floor((clock + (r * 6 + c) * 140) / 700) % 2;   // a slow wave across hidden tiles
    const img = (store.board || {})[boardKey(r, c)] ? set.found : set.hidden[pulse];
    ctx.drawImage(img, (BOARD_X + c) * T - cx, (BOARD_Y + r) * T - cy);
  }));
}

let dementor = null;   // { x, y, a }: where it hovers (centre-bottom, in pixels) and how visible it is
let patronus = null;   // { x, y, t0 }: a burst of silver light from the player
function drawDementor(cx, cy) {
  if (patronus) {
    const k = Math.min(1, (clock - patronus.t0) / 1100);
    ctx.lineWidth = 2;
    for (const [r, a] of [[k * 110, 0.9], [k * 75, 0.7], [k * 40, 0.5]]) {
      ctx.strokeStyle = `rgba(225,236,255,${(a * (1 - k)).toFixed(2)})`;
      ctx.beginPath(); ctx.arc(patronus.x - cx, patronus.y - cy, Math.max(1, r), 0, Math.PI * 2); ctx.stroke();
    }
    for (let i = 0; i < 16; i++) {                                  // sparkles flying outward
      const ang = i / 16 * Math.PI * 2 + i, r = k * (40 + (i % 4) * 18);
      ctx.fillStyle = `rgba(255,255,255,${(1 - k).toFixed(2)})`;
      ctx.fillRect(Math.round(patronus.x + Math.cos(ang) * r) - cx, Math.round(patronus.y + Math.sin(ang) * r) - cy, 2, 2);
    }
  }
  if (!dementor || dementor.a <= 0) return;
  const img = dementorFrames[Math.floor(clock / 220) % 2];
  const bob = Math.round(Math.sin(clock / 300) * 2);
  ctx.globalAlpha = dementor.a;
  ctx.fillStyle = "rgba(10,8,20,0.35)";                             // faint shadow on the floor
  ctx.fillRect(Math.round(dementor.x) - 7 - cx, Math.round(dementor.y) + 6 - cy, 14, 2);
  ctx.drawImage(img, Math.round(dementor.x) - 11 - cx, Math.round(dementor.y) - 32 + bob - cy);
  ctx.globalAlpha = 1;
}

const BULB_COLORS = ["#f8d048", "#f06080", "#60c0f8", "#80e080", "#f8a040"];
const WINDOW_STARS = [[-8, 2], [3, -6], [-4, -6], [7, 1], [-2, 6]];
function atticUnder(cx, cy) {
  // twinkling stars in the round window
  WINDOW_STARS.forEach(([sx, sy], i) => {
    if (Math.floor(clock / 500 + i * 1.7) % 3 === 0) {
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(AW * T / 2 + sx - cx, 25 + sy - cy, 1, 1);
    }
  });
  // fairy lights: a blanket-fort canopy strung between two posts over the quilt
  const x0 = 177, x1 = 270;
  for (const x of [x0 - 1, x1]) {
    ctx.fillStyle = "#3a2416"; ctx.fillRect(x - 1 - cx, 96 - cy, 3, 34);
    ctx.fillStyle = "#8a5a38"; ctx.fillRect(x - cx, 96 - cy, 1, 34);
    ctx.fillStyle = "#c89048"; ctx.fillRect(x - 1 - cx, 94 - cy, 3, 2);
  }
  const sag = x => { const t = (x - x0) / (x1 - x0); return Math.round(97 + 8 * Math.sin(Math.PI * ((t * 2) % 1))); };
  ctx.fillStyle = "#2a3a2a";
  for (let x = x0; x <= x1; x++) ctx.fillRect(x - cx, sag(x) - cy, 1, 1);
  for (let i = 0; i < 12; i++) {
    const x = x0 + 4 + i * 8, y = sag(x) + 1;
    const col = BULB_COLORS[i % BULB_COLORS.length];
    const on = dementor ? Math.random() < 0.25 : (Math.floor(clock / 380) + i * 3) % 7 !== 0;
    if (on) { ctx.fillStyle = col + "55"; ctx.fillRect(x - 2 - cx, y - 1 - cy, 5, 5); }
    ctx.fillStyle = on ? col : "#5a5048";
    ctx.fillRect(x - cx, y - cy, 2, 2);
  }

function atticOver(cx, cy) {
  drawDementor(cx, cy);
  // moonlight falling from the round window
  ctx.fillStyle = "rgba(200,215,255,0.07)";
  ctx.beginPath();
  ctx.moveTo(134 - cx, 36 - cy); ctx.lineTo(154 - cx, 36 - cy); ctx.lineTo(190 - cx, 176 - cy); ctx.lineTo(108 - cx, 176 - cy);
  ctx.fill();
  // dust drifting through the beam
  for (let i = 0; i < 18; i++) {
    const y = 40 + ((clock * 0.006 + i * 23) % 135);
    const spread = (y - 36) / 140;
    const x = 144 + Math.sin(i * 2.3) * (10 + 30 * spread) + Math.sin(clock / 1700 + i) * 3;
    ctx.fillStyle = i % 3 ? "rgba(255,244,214,0.55)" : "rgba(255,255,255,0.8)";
    ctx.fillRect(Math.round(x) - cx, Math.round(y) - cy, 1, 1);
  }
  // warm glow over the nook
  if (!nookGlow) {
    nookGlow = ctx.createRadialGradient(224, 140, 4, 224, 140, 80);
    nookGlow.addColorStop(0, "rgba(255,190,110,0.16)");
    nookGlow.addColorStop(1, "rgba(255,190,110,0)");
  }
  ctx.fillStyle = nookGlow;
  ctx.fillRect(140 - cx, 60 - cy, 148, 132);
  // cold air around the wardrobe, stronger while it shakes
  if (!chillGlow) {
    chillGlow = ctx.createRadialGradient(256, 40, 4, 256, 40, 60);
    chillGlow.addColorStop(0, "rgba(90,120,200,0.22)");
    chillGlow.addColorStop(1, "rgba(90,120,200,0)");
  }
  ctx.globalAlpha = wardrobeShaking(clock) ? 1 : 0.6;
  ctx.fillStyle = chillGlow;
  ctx.fillRect(196 - cx, 0 - cy, 92, 110);
  ctx.globalAlpha = 1;
  if (wardrobeShaking(clock)) {
    for (let i = 0; i < 7; i++) {                     // dark wisps escaping over the top
      const p = ((clock / 600 + i * 0.37) % 1);
      const x = 246 + i * 3 + Math.round(Math.sin(clock / 160 + i) * 2);
      ctx.fillStyle = `rgba(40,30,60,${(0.8 - p * 0.8).toFixed(2)})`;
      ctx.fillRect(x - cx, Math.round(14 - p * 12) - cy, 2, 2);
    }
  }
  // dithered darkness toward the edges
  if (!atticShade) atticShade = canvas(VW, VH, g => {
    const bayer = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
    for (let y = 0; y < VH; y++) for (let x = 0; x < VW; x++) {
      const dx = (x - 144) / 175, dy = (y - 104) / 125;
      const v = Math.max(0, (Math.sqrt(dx * dx + dy * dy) - 0.5) / 0.55);
      const lvl = Math.min(3, Math.floor(v * 3 + bayer[y & 3][x & 3] / 16));
      if (lvl > 0) px(g, x, y, `rgba(20,10,26,${lvl * 0.15})`);
    }
  });
  ctx.drawImage(atticShade, 0, 0);
}

// ================================================================ player state
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const player = {
  x: 15, y: 12, px: 15 * T, py: 12 * T, dir: "down",
  moving: false, t: 0, fx: 0, fy: 0, step: 0, turn: 0, bump: 0, zone: null,
};
const held = [];
let queued = null;   // a tapped step that should happen even if the key is already released
let busy = false;

function facing() { const [dx, dy] = DIRS[player.dir]; return [player.x + dx, player.y + dy]; }

function placePlayer(s, x, y, dir) {
  scene = s;
  Object.assign(player, { x, y, px: x * T, py: y * T, dir, moving: false, t: 0, turn: 0, bump: 0 });
  player.zone = s === house ? zoneOf(x, y) : null;
  queued = null; held.length = 0;
}

function tryMove(dir) {
  const [dx, dy] = DIRS[dir];
  const nx = player.x + dx, ny = player.y + dy;
  if (scene === town && tileAt(nx, ny) === "D" && dir === "up") { enterBuilding(); return; }
  if (scene === house && ny >= HH && dir === "down" && (nx === 8 || nx === 9)) { exitBuilding(); return; }
  const lad = scene.objAt.get(`${nx},${ny}`);
  if (lad && lad.use === "ladder" && dir === "up") { climbUp(); return; }
  if (blocked(nx, ny)) { player.bump += 1; return; }
  player.fx = player.px; player.fy = player.py;
  player.x = nx; player.y = ny;
  player.moving = true; player.t = 0;
  player.step ^= 1;
}

function arrived() {
  if (scene === attic) {
    if (tileAt(player.x, player.y) === "H") climbDown();
    return;
  }
  if (scene !== house) return;
  const z = zoneOf(player.x, player.y);
  if (z !== player.zone) {
    player.zone = z;
    if (z !== "hall") showBanner(TRAITS[z] ? TRAITS[z].place : ZONE_NAMES[z]);
  }
  const b = boardAt(player.x, player.y);
  if (b) openTile(b.r, b.c);
}

function update(dt) {
  if (dlg || busy) return;
  const want = held[held.length - 1];
  if (!player.moving && queued) {
    const q = queued; queued = null;
    player.dir = q; player.turn = TURN_MS; tryMove(q);
    return;
  }
  if (player.moving) {
    player.t += dt / WALK_MS;
    if (player.t >= 1) {
      player.px = player.x * T; player.py = player.y * T; player.moving = false;
      arrived();
      const next = want || queued; queued = null;
      if (next && !busy && !dlg) { player.dir = next; tryMove(next); }
    } else {
      player.px = Math.round(player.fx + (player.x * T - player.fx) * player.t);
      player.py = Math.round(player.fy + (player.y * T - player.fy) * player.t);
    }
    return;
  }
  if (!want) { player.turn = 0; player.bump = 0; return; }
  if (want !== player.dir) { player.dir = want; player.turn = 0; return; }
  player.turn += dt;
  if (player.turn >= TURN_MS) {
    if (player.bump) player.bump += dt; else tryMove(want);
  }
}

// ================================================================ render
const ctx = document.getElementById("game").getContext("2d");
ctx.imageSmoothingEnabled = false;
let clock = 0;

function render() {
  const cx = Math.max(0, Math.min(scene.W * T - VW, player.px + 8 - VW / 2)) | 0;
  const cy = Math.max(0, Math.min(scene.H * T - VH, player.py + 8 - VH / 2)) | 0;
  const frames = scene.bg;
  ctx.drawImage(frames[(Math.floor(clock / 650) & 1) % frames.length], cx, cy, VW, VH, 0, 0, VW, VH);
  if (scene === house) drawBoard(cx, cy);
  if (scene.under) scene.under(cx, cy);

  // objects and player, drawn back to front by the row they stand on
  const list = scene.objects.map(o => ({ y: (o.y + 1) * T, o }));
  list.push({ y: player.py + T + 0.5, p: true });
  list.sort((a, b) => a.y - b.y);
  for (const d of list) {
    if (d.o) {
      const img = d.o.anim ? d.o.anim(clock) : d.o.img;
      const [jx, jy] = d.o.jitter ? d.o.jitter(clock) : [0, 0];
      ctx.drawImage(img, d.o.x * T + (d.o.dx || 0) + jx - cx, (d.o.y + 1) * T - img.height + jy - cy);
    }
    else drawPlayer(cx, cy);
  }
  if (scene.over) scene.over(cx, cy);
}
function drawPlayer(cx, cy) {
  let frame = 0;
  if (player.moving && player.t < 0.5) frame = 1 + player.step;
  else if (player.bump > 1 && Math.floor(player.bump / 220) % 2 === 0) frame = 1 + (Math.floor(player.bump / 440) % 2);
  const sx = player.px - cx, sy = player.py - cy;
  ctx.fillStyle = "rgba(20,40,40,.25)";
  ctx.fillRect(sx + 4, sy + 14, 8, 2); ctx.fillRect(sx + 3, sy + 15, 10, 1);
  ctx.drawImage(SPR[player.dir][frame], sx, sy + T - SPR_H);
}

let last = null;
function loop(now) {
  // rAF timestamps can be slightly earlier than performance.now() on the first frame,
  // so clamp to keep time moving forward.
  const dt = last === null ? 0 : Math.max(0, Math.min(50, now - last));
  last = now; clock += dt;
  try {
    update(dt);
    tickDialog(dt);
    updateHint();
    badgesEl.hidden = !(scene !== town && (dlg || clock < hudUntil));
    render();
  } catch (err) {
    console.error(err);
  }
  requestAnimationFrame(loop);
}

// ================================================================ dialogue
const dialogEl = document.getElementById("dialog");
const shownEl = document.getElementById("shown");
const restEl = document.getElementById("rest");
const moreEl = document.getElementById("more");
const choiceEl = document.getElementById("choice");
const entryEl = document.getElementById("entry");
const inputEl = document.getElementById("entryInput");
let dlg = null;

// say(pages)                      -> resolves when closed
// say(pages, { options: [...] })  -> resolves with the picked index, or -1 if backed out
// say(pages, { input: true })     -> resolves with the typed text ("" if skipped)
function say(pages, opt = {}) {
  if (typeof pages === "string") pages = [pages];
  return new Promise(resolve => {
    held.length = 0; queued = null;
    dlg = { pages, i: 0, n: 0, shownN: -1, options: opt.options || null, input: !!opt.input, mode: null, sel: 0, resolve };
    dialogEl.hidden = false;
    drawText();
  });
}
const pageText = () => dlg.pages[dlg.i];
const pageDone = () => dlg.n >= pageText().length;
const onLastPage = () => dlg.i === dlg.pages.length - 1;
const hasExtra = () => !!(dlg.options || dlg.input);

function drawText() {
  const text = pageText(), n = Math.floor(dlg.n);
  if (n !== dlg.shownN) {
    shownEl.textContent = text.slice(0, n);
    restEl.textContent = text.slice(n);
    dlg.shownN = n;
  }
  moreEl.hidden = !pageDone() || (onLastPage() && hasExtra());
}
function maybeOpenExtra() {
  if (dlg.mode || !onLastPage() || !pageDone()) return;
  if (dlg.options) openOptions();
  else if (dlg.input) openInput();
}
function tickDialog(dt) {
  if (!dlg || dlg.mode || pageDone()) return;
  dlg.n = Math.min(pageText().length, dlg.n + dt * 0.045);
  drawText();
  maybeOpenExtra();
}
function openOptions() {
  dlg.mode = "options"; dlg.sel = 0;
  choiceEl.replaceChildren(...dlg.options.map((label, i) => {
    const el = document.createElement("div");
    el.className = "opt" + (i === 0 ? " sel" : "");
    el.textContent = label;
    el.addEventListener("click", e => { e.stopPropagation(); if (dlg && dlg.mode === "options") closeDialog(i); });
    return el;
  }));
  choiceEl.hidden = false;
}
function openInput() {
  dlg.mode = "input";
  inputEl.value = "";
  entryEl.hidden = false;
  inputEl.focus();
}
function closeDialog(value) {
  dialogEl.hidden = true; choiceEl.hidden = true; entryEl.hidden = true;
  inputEl.blur();
  const { resolve } = dlg; dlg = null; held.length = 0; queued = null;
  resolve(value);
}
function dialogA() {
  if (dlg.mode === "options") return closeDialog(dlg.sel);
  if (dlg.mode === "input") return closeDialog(inputEl.value.trim());
  if (!pageDone()) { dlg.n = pageText().length; drawText(); maybeOpenExtra(); return; }
  if (!onLastPage()) { dlg.i++; dlg.n = 0; dlg.shownN = -1; drawText(); return; }
  closeDialog();
}
function dialogB() {
  if (dlg.mode === "options") return closeDialog(-1);
  if (dlg.mode === "input") return closeDialog("");
  dialogA();
}
function dialogMove(dir) {
  if (dlg.mode !== "options" || (dir !== "up" && dir !== "down")) return;
  const n = dlg.options.length;
  dlg.sel = (dlg.sel + (dir === "down" ? 1 : n - 1)) % n;
  [...choiceEl.children].forEach((o, i) => o.classList.toggle("sel", i === dlg.sel));
}
dialogEl.addEventListener("click", () => { if (dlg && !dlg.mode) dialogA(); });

// ================================================================ scripted moments
const wait = ms => new Promise(r => setTimeout(r, ms));
const fadeEl = document.getElementById("fade");
const fadeOut = async () => { fadeEl.classList.add("on"); await wait(380); };
const fadeIn = async () => { fadeEl.classList.remove("on"); await wait(380); };
const short = name => name.length > 10 ? name.slice(0, 9) + "." : name;

// Runs one scripted sequence at a time and keeps the player still while it plays.
const script = fn => async (...args) => {
  if (busy) return;
  busy = true;
  try { await fn(...args); } finally { busy = false; held.length = 0; queued = null; }
};

const enterBuilding = script(async () => {
  player.dir = "up";
  const pick = await say("The front door is unlocked.\nWould you like to step inside?", { options: ["YES", "NO"] });
  if (pick !== 0) return;
  const col = player.x - 6;              // town door cols 14-15 -> house mat cols 8-9
  await fadeOut();
  placePlayer(house, col, 11, "up");
  drawBadges(); hudUntil = clock + 3000;
  await wait(120);
  await fadeIn();
  showBanner("HOME BASE");
  if (!store.welcomed) {
    await say(WELCOME);
    store.welcomed = true; save();
  }
});

const exitBuilding = script(async () => {
  const col = player.x + 6;
  await fadeOut();
  placePlayer(town, col, 12, "down");
  await wait(120);
  await fadeIn();
  showBanner("ROUTE 01");
});

async function runTrait(id) {
  const t = TRAITS[id];
  const q = t.question;
  await say(t.intro);
  const pick = await say(q.q, { options: q.options });
  if (pick < 0) { await say("No rush. Come back anytime."); return; }
  record(id, q.q, q.options[pick]);
  await say([pick === q.answer ? "That's right!" : `Not quite! It's\n${q.options[q.answer]}.`, q.reveal]);

  const text = await say(t.share.prompt, { input: true });
  if (text) { record(id, t.share.prompt, text); await say(t.share.thanks); }
  else await say("That's okay. Maybe next time!");

  if (!store.found[id]) {
    store.found[id] = true; save();
    drawBadges(id); hudUntil = clock + 3000;
    await say(`You discovered a trait:\n${t.trait}!`);
    if (foundCount() === TRAIT_IDS.length)
      await say([`That's all ${TRAIT_IDS.length} traits!`, "Thanks for getting to know me.\nThe attic is waiting."]);
  }
}

};

let geo = null;
async function loadGeo() {
  if (geo) return geo;
  if (!window.d3 || !window.topojson) throw new Error("Map libraries did not load");
  const get = url => fetch(url).then(r => { if (!r.ok) throw new Error(url + " " + r.status); return r.json(); });
  const [world, us] = await Promise.all([get(WORLD_URL), get(US_URL)]);

// Draws a shape antialiased, then keeps only solid pixels: a crisp 1-bit mask.
function maskOf(draw, thresh = 100) {
  const c = canvas(MW2, MH2), g = c.getContext("2d", { willReadFrequently: true });
  g.fillStyle = g.strokeStyle = "#000";
  draw(g);
  const d = g.getImageData(0, 0, MW2, MH2).data, m = new Uint8Array(MW2 * MH2);
  for (let i = 0; i < m.length; i++) m[i] = d[i * 4 + 3] > thresh ? 1 : 0;
  return m;
}
const fillGeo = (proj, obj) => g => { g.beginPath(); d3.geoPath(proj, g)(obj); g.fill(); };
const strokeGeo = (proj, obj) => g => { g.lineWidth = 1.3; g.beginPath(); d3.geoPath(proj, g)(obj); g.stroke(); };

// Paints masks into pixels: first matching layer wins, outlines where a layer meets anything else.
function compose(g, [x0, y0, x1, y1], layers) {
  const w = x1 - x0, h = y1 - y0, img = g.createImageData(w, h), d = img.data;
  for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
    const i = y * MW2 + x;
    let col = null;
    for (const L of layers) {
      if (!L.fill[i]) continue;
      const edge = (x > x0 && !L.fill[i - 1]) || (x < x1 - 1 && !L.fill[i + 1]) ||
                   (y > y0 && !L.fill[i - MW2]) || (y < y1 - 1 && !L.fill[i + MW2]);
      col = edge ? L.edge : (L.lines && L.lines[i] ? L.line : L.col);
      break;
    }
    if (!col) col = (y % 6 === 0 && (x + y * 2) % 14 < 4) ? MC.oceanLt : MC.ocean;
    const [r, gg, b] = rgb(col), o = ((y - y0) * w + (x - x0)) * 4;
    d[o] = r; d[o + 1] = gg; d[o + 2] = b; d[o + 3] = 255;
  }
  g.putImageData(img, x0, y0);
}
function brushLine(g, pts, size, col) {
  g.fillStyle = col;
  const h = Math.floor(size / 2);
  for (let k = 1; k < pts.length; k++) {
    let [x0, y0] = pts[k - 1].map(Math.round);
    const [x1, y1] = pts[k].map(Math.round);
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx + dy;
    for (;;) {
      g.fillRect(x0 - h, y0 - h, size, size);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
  }
}
function marker(g, [x, y], fill, size = 9) {
  x = Math.round(x); y = Math.round(y);
  const h = Math.floor(size / 2);
  g.fillStyle = MC.routeEdge; g.fillRect(x - h, y - h, size, size);
  g.fillStyle = fill; g.fillRect(x - h + 1, y - h + 1, size - 2, size - 2);
  g.fillStyle = "#fff"; g.fillRect(x - h + 2, y - h + 2, 2, 2);
}

const builtMaps = {};
function buildWorldMap() {
  const { world } = geo;
  const all = topojson.feature(world, world.objects.countries);
  const land = { type: "FeatureCollection", features: all.features.filter(f => f.id !== "010") };
  const visited = { type: "FeatureCollection", features: all.features.filter(f => TRAVEL.visited.includes(f.id)) };
  const borders = topojson.mesh(world, world.objects.countries, (a, b) => a !== b);
  const layersFor = proj => [
    { fill: maskOf(fillGeo(proj, visited)), lines: maskOf(strokeGeo(proj, borders)), col: MC.visited, edge: MC.landEdge, line: MC.visitedLine },
    { fill: maskOf(fillGeo(proj, land)), lines: maskOf(strokeGeo(proj, borders)), col: MC.land, edge: MC.landEdge, line: MC.border },
  ];
  const proj = d3.geoNaturalEarth1().fitExtent(WORLD_AREA, land);
  const [ix0, iy0, ix1, iy1] = INSET;
  const iproj = d3.geoMercator().fitExtent([[ix0 + 8, iy0 + 16], [ix1 - 8, iy1 - 8]],
    { type: "MultiPoint", coordinates: [[113.3, 21.9], [114.45, 22.6]] });

  const base = canvas(MW2, MH2), g = base.getContext("2d");
  compose(g, [0, 0, MW2, MH2], layersFor(proj));
  // close-up box for Hong Kong + Macau
  compose(g, INSET, layersFor(iproj));
  g.fillStyle = MC.frame;
  g.fillRect(ix0 - 2, iy0 - 2, ix1 - ix0 + 4, 2); g.fillRect(ix0 - 2, iy1, ix1 - ix0 + 4, 2);
  g.fillRect(ix0 - 2, iy0, 2, iy1 - iy0); g.fillRect(ix1, iy0, 2, iy1 - iy0);
  g.fillStyle = "#f8f8f8"; g.fillRect(ix0, iy0, ix1 - ix0, 13);
  g.fillStyle = MC.frame; g.font = "8px 'Press Start 2P', monospace"; g.textBaseline = "top";
  g.fillText("HK + MACAU", ix0 + 4, iy0 + 3);
  // a box on the world map showing what the close-up covers
  const [[bx0, by0], [bx1, by1]] = [proj([113.2, 22.8]), proj([114.6, 21.8])].map(p => p.map(Math.round));
  g.fillStyle = MC.frame;
  g.fillRect(bx0 - 3, by0 - 3, bx1 - bx0 + 7, 1); g.fillRect(bx0 - 3, by1 + 3, bx1 - bx0 + 7, 1);
  g.fillRect(bx0 - 3, by0 - 3, 1, by1 - by0 + 7); g.fillRect(bx1 + 3, by0 - 3, 1, by1 - by0 + 7);

  const items = TRAVEL.world.map(p => ({ ...p, pt: (p.inset ? iproj : proj)(p.at) }));
  for (const it of items) marker(g, it.pt, MC.route);
  return { title: "WORLD MAP", base, items, story: true };
}

function buildUSMap() {
  const { us, world } = geo;
  const skip = ["02", "15", "60", "66", "69", "72", "78"];   // Alaska, Hawaii, territories
  const states = topojson.feature(us, us.objects.states);
  const lower48 = { type: "FeatureCollection", features: states.features.filter(f => !skip.includes(f.id)) };
  const borders = topojson.mesh(us, us.objects.states, (a, b) => a !== b);
  const neighbors = topojson.feature(world, world.objects.countries);
  const proj = d3.geoAlbers().fitExtent(MAP_AREA, lower48);

  const base = canvas(MW2, MH2), g = base.getContext("2d");
  compose(g, [0, 0, MW2, MH2], [
    { fill: maskOf(fillGeo(proj, lower48)), lines: maskOf(strokeGeo(proj, borders)), col: MC.land, edge: MC.landEdge, line: MC.border },
    { fill: maskOf(fillGeo(proj, neighbors)), col: MC.other, edge: MC.otherEdge },
  ]);
  const items = TRAVEL.trips.map(t => ({ ...t, pts: t.path.map(p => proj(p)) }));
  for (const it of items) it.pt = it.pts[it.pts.length - 1];
  for (const it of items) if (it.pts.length > 1) brushLine(g, it.pts, 5, MC.routeEdge);
  for (const it of items) if (it.pts.length > 1) brushLine(g, it.pts, 3, MC.route);
  for (const it of items) marker(g, it.pt, it.pts.length > 1 ? MC.route : MC.home, it.pts.length > 1 ? 9 : 11);
  return { title: "US ROAD TRIPS", base, items };
}

// Spotify share link -> embed URL. Returns "" if it isn't a Spotify link.
function spotifyEmbed(url) {
  const m = /open\.spotify\.com\/(?:intl-[a-z]+\/)?(playlist|album|track|artist)\/([A-Za-z0-9]+)/.exec(url || "");
  return m ? `https://open.spotify.com/embed/${m[1]}/${m[2]}?utm_source=generator` : "";
}

function drawSleeve(g, pl, seedv) {
  const [bg, accent, label] = pl.colors;
  g.clearRect(0, 0, 48, 40);
  // record sliding out to the right
  blob(g, 33, 20, 14, 14, "#181818", "#0a0a0a");
  for (let r = 5; r < 13; r += 3)
    for (let a = 0; a < 40; a++) {
      const x = Math.round(33 + Math.cos(a / 40 * Math.PI * 2) * r), y = Math.round(20 + Math.sin(a / 40 * Math.PI * 2) * r);
      if ((a + r) % 3 === 0) px(g, x, y, "#2c2c2c");
    }
  blob(g, 33, 20, 4, 4, label, label);
  px(g, 33, 20, "#0a0a0a");
  // sleeve
  box(g, 1, 4, 32, 32, bg, "#181818");
  seed = seedv;
  const kind = seedv % 3;
  if (kind === 0) {             // sunset bands
    for (let i = 0; i < 4; i++) R(g, 2, 20 + i * 4, 30, 2, accent);
    disc(g, 17, 18, 6, accent);
  } else if (kind === 1) {      // checker corner + sun
    for (let y = 0; y < 3; y++) for (let x = 0; x < 3; x++) if ((x + y) % 2) R(g, 4 + x * 4, 24 + y * 4, 4, 4, accent);
    disc(g, 23, 13, 5, accent);
  } else {                      // diagonal stripes
    for (let y = 5; y < 35; y++) for (let x = 2; x < 32; x++) if ((x + y) % 8 < 2) px(g, x, y, accent);
  }
  R(g, 2, 5, 30, 1, "rgba(255,255,255,.25)");
}

// YouTube link -> privacy-friendly embed URL. Returns "" if it isn't a YouTube link.
function youtubeEmbed(url) {
  const m = /(?:youtube\.com\/watch\?(?:.*&)?v=|youtu\.be\/|youtube\.com\/embed\/)([A-Za-z0-9_-]{6,})/.exec(url || "");
  return m ? `https://www.youtube-nocookie.com/embed/${m[1]}?rel=0` : "";
}

function crateShow(i) {
  crateSel = (i + PLAYLISTS.length) % PLAYLISTS.length;
  const pl = PLAYLISTS[crateSel];
  drawSleeve(sleeveCtx, pl, crateSel + 1);
  document.getElementById("crateName").textContent = pl.name;
  document.getElementById("crateMood").textContent = pl.mood;
  document.getElementById("crateCount").textContent = `${crateSel + 1}/${PLAYLISTS.length}`;
  const link = document.getElementById("crateLink");
  const playerEl = document.getElementById("cratePlayer");
  const videoEl = document.getElementById("crateVideo");
  const yt = youtubeEmbed(pl.youtube);
  // a video replaces the sleeve with a little screen, and the bottom player isn't needed
  document.getElementById("sleeve").hidden = !!yt;
  crateEl.classList.toggle("watching", !!yt);
  videoEl.hidden = !yt;
  playerEl.hidden = !!yt;
  if (yt) {
    link.hidden = false;
    link.href = pl.youtube;
    link.textContent = "WATCH ON YOUTUBE ↗";
    const frame = document.createElement("iframe");
    frame.src = yt;
    frame.title = `${pl.name} on YouTube`;
    frame.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen";
    frame.allowFullscreen = true;
    videoEl.replaceChildren(frame);
    playerEl.replaceChildren();
    return;
  }
  videoEl.replaceChildren();
  link.textContent = "OPEN IN SPOTIFY ↗";
  const embed = spotifyEmbed(pl.url);
  link.hidden = !embed;
  if (embed) {
    link.href = pl.url;
    const frame = document.createElement("iframe");
    frame.src = embed;
    frame.title = `${pl.name} on Spotify`;
    frame.allow = "autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture";
    frame.loading = "lazy";
    playerEl.replaceChildren(frame);
  } else {
    const soon = document.createElement("div");
    soon.className = "soon";
    soon.textContent = "THIS RECORD IS STILL BEING PRESSED.\nCHECK BACK SOON!";
    soon.style.whiteSpace = "pre-wrap";
    playerEl.replaceChildren(soon);
  }
}

// The charm prompt. Each press adds power, which slowly drains; while it's low,
// the dementor leans in closer. Resolves once the meter is full.
function castPatronus(stop, target) {
  const spellEl = document.getElementById("spell");
  const fillEl = document.getElementById("spellFill");
  let power = 0, last = performance.now();
  spellEl.hidden = false;
  return new Promise(resolve => {
    overlay = { step: () => {}, close: () => {}, a: () => { power = Math.min(1, power + 0.13); } };
    const tick = () => {
      const now = performance.now(), dt = Math.min(100, now - last);
      last = now;
      if (power < 1) power = Math.max(0, power - dt * 0.00016);
      fillEl.style.width = (power * 100).toFixed(1) + "%";
      const lean = (1 - power) * 9;                             // creeps toward her when the charm is weak
      const dx = target.x - stop.x, dy = target.y - stop.y, len = Math.hypot(dx, dy) || 1;
      dementor.x = stop.x + dx / len * lean;
      dementor.y = stop.y + dy / len * lean;
      if (power >= 1) {
        spellEl.hidden = true;
        overlay = null;
        resolve();
        return;
      }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}

// Runs fn(k) with k going 0 -> 1 over ms milliseconds.
async function tween(ms, fn) {
  const t0 = performance.now();
  for (;;) {
    const k = Math.min(1, (performance.now() - t0) / ms);
    fn(k);
    if (k >= 1) return;
    await wait(16);
  }
}
// Slides the player up to `tiles` tiles in a direction (stopping at anything solid), with a little hop.
async function knockBack(dx, dy, tiles) {
  let n = 0;
  while (n < tiles && !blocked(player.x + dx * (n + 1), player.y + dy * (n + 1))) n++;
  if (!n) return;
  const sx = player.px, sy = player.py, ex = (player.x + dx * n) * T, ey = (player.y + dy * n) * T;
  await tween(110 * n + 80, k => {
    const e = 1 - (1 - k) * (1 - k);
    player.px = Math.round(sx + (ex - sx) * e);
    player.py = Math.round(sy + (ey - sy) * e - Math.sin(k * Math.PI) * 6);
  });
  player.x += dx * n; player.y += dy * n;
  player.px = ex; player.py = ey;
}

    });
    return r.ok ? "sent" : "failed";
  } catch {
    return "failed";
  }
}

// ================================================================ input
const KEYMAP = {
  ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
  w: "up", s: "down", a: "left", d: "right", W: "up", S: "down", A: "left", D: "right",
  z: "a", Z: "a", Enter: "a", " ": "a",
  x: "b", X: "b", Escape: "b", Backspace: "b",
};
function press(k, repeat) {
  if (overlay) {
    if (k === "left" || k === "up") overlay.step(-1);
    else if (k === "right" || k === "down") overlay.step(1);
    else if (k === "b" && !repeat) overlay.close();
    else if (k === "a" && !repeat && overlay.a) overlay.a();
    return;
  }
  if (k in DIRS) {
    if (dlg) { if (!repeat) dialogMove(k); return; }
    if (!held.includes(k)) held.push(k);
    if (busy || repeat) return;
    if (player.moving) queued = k;
    else if (k === player.dir) queued = k;
    else { player.dir = k; player.turn = 0; player.bump = 0; }
    return;
  }
  if (repeat) return;
  if (k === "a") dlg ? dialogA() : interact();
  if (k === "b" && dlg) dialogB();
}
function release(k) {
  const i = held.indexOf(k);
  if (i >= 0) held.splice(i, 1);
}
addEventListener("keydown", e => {
  if (e.target === inputEl) {
    if (e.isComposing) return;
    if (e.key === "Enter") { e.preventDefault(); if (dlg && dlg.mode === "input") closeDialog(inputEl.value.trim()); }
    else if (e.key === "Escape") { e.preventDefault(); if (dlg && dlg.mode === "input") closeDialog(""); }
    return;
  }
  const k = KEYMAP[e.key];
  if (!k) return;
  e.preventDefault();
  press(k, e.repeat);
});
addEventListener("keyup", e => { const k = KEYMAP[e.key]; if (k) release(k); });
addEventListener("blur", () => { held.length = 0; });

document.querySelectorAll(".pad button").forEach(btn => {
  const k = btn.dataset.k;
  btn.addEventListener("pointerdown", e => { e.preventDefault(); btn.setPointerCapture(e.pointerId); press(k, false); });
  ["pointerup", "pointercancel", "lostpointercapture"].forEach(ev => btn.addEventListener(ev, () => release(k)));
});

// ================================================================ sizing
function fit() {
  const coarse = matchMedia("(pointer: coarse)").matches;
  const aw = innerWidth - 40, ah = innerHeight - (coarse ? 210 : 90);
  let s = Math.min(aw / VW, ah / VH);
  if (s >= 2) s = Math.floor(s);
  s = Math.max(1, s);
  document.documentElement.style.setProperty("--s", s + "px");
}
addEventListener("resize", fit);
fit();

  window.dev = {
    warp: (x, y, dir = "up") => { placePlayer(house, x, y, dir); drawBadges(); },
    records: () => openCrate(),
    album: () => openAlbum(),
    cookbook: () => openAlbum(0, "dishes"),
    attic: (x = HATCH[0] + 1, y = HATCH[1], dir = "right") => placePlayer(attic, x, y, dir),
    sprites: () => {            // shows every player frame, enlarged, in a new canvas at the top of the page
      const c = document.createElement("canvas"), z = 8;
      c.width = 16 * 9 * z; c.height = SPR_H * z; c.style.imageRendering = "pixelated";
      const g = c.getContext("2d"); g.imageSmoothingEnabled = false;
      ["down", "up", "left"].forEach((d, i) => SPR[d].forEach((im, j) => g.drawImage(im, (i * 3 + j) * 16 * z, 0, 16 * z, SPR_H * z)));
      document.body.prepend(c);
    },
    map: kind => loadGeo().then(() => openMap(kind)),
  };
}

// ================================================================ start
placePlayer(town, 15, 12, "down");
drawBadges();
setTimeout(() => showBanner("ROUTE 01"), 300);
requestAnimationFrame(loop);
})();
</script>
